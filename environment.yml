name: se-gnn-wc2026
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - pandas=2.1
  - matplotlib=3.8
  - scikit-learn=1.3
  - scipy=1.11
  - statsmodels=0.14      # SARIMA baseline in multi_venue_loocv.py
  - pip:
    - torch==2.1.0
    - sentence-transformers==2.7.0
    - pyarrow>=14.0        # required for parquet support (pandas)
